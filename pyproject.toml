[project]
name = "marketrank"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyspark==3.5.9"]

[project.optional-dependencies]
dev = [
    "dbt-spark[session]",
    "dbt-duckdb",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
